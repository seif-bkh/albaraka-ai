openapi: 3.1.0
info:
  title: Al-Mouchir — Trilingual Sharia-Compliant RAG Assistant API
  version: 1.0.0
  description: |
    API contract for both facades of the Al Baraka Bank Tunisia assistant:

    * **Frontoffice** (`/api/v1/**`) — customer and agent conversation endpoints, public knowledge.
    * **Backoffice** (`/api/v1/admin/**`) — knowledge, governance, tuning, quality, audit.

    Design rules are in `docs/08-api-design.md`. Streaming answers use Server-Sent Events; the event
    grammar is normative and documented under the `POST /assistant/conversations/{id}/messages`
    operation.

    This file is the source of truth: TypeScript types (`libs/shared-contracts`) and Spring controller
    interfaces are generated from it, and `oasdiff` blocks breaking changes in CI.
  contact:
    name: Al-Mouchir architecture
  license:
    name: Proprietary — internal design documentation
servers:
  - url: https://assistant.albaraka.com.tn
    description: Production
  - url: https://assistant-uat.albaraka.com.tn
    description: UAT (real approved knowledge base copy)
  - url: http://localhost:8080
    description: Local development
tags:
  - { name: assistant, description: Frontoffice conversation endpoints }
  - { name: public, description: Public knowledge base and reference data }
  - { name: admin-documents, description: Knowledge base management }
  - { name: admin-ingestion, description: Parsing, chunking and embedding jobs }
  - { name: admin-reviews, description: Sharia review board and fatwa requests }
  - { name: admin-prompts, description: Prompt studio }
  - { name: admin-retrieval, description: Retrieval lab and configuration }
  - { name: admin-models, description: Model and provider configuration }
  - { name: admin-guardrails, description: Guardrail policies, lexicons and events }
  - { name: admin-quality, description: Feedback, QA, golden set, evaluations }
  - { name: admin-analytics, description: Usage, intents, cost, coverage, governance KPIs }
  - { name: admin-content-ops, description: Glossary, Derja map, assistant configuration, agencies }
  - { name: admin-audit, description: Audit log, chain verification, evidence packs, erasure }
  - { name: admin-operations, description: Kill switch, caches, health, release bundles }

security:
  - keycloakJwt: []
  - {}

paths:
  # ───────────────────────────────────────────── FRONTOFFICE ─────────────────────────────────────
  /api/v1/assistant/config:
    get:
      tags: [assistant]
      operationId: getAssistantConfig
      summary: Bootstrap configuration for the frontoffice and the widget
      security: [{}, { keycloakJwt: [] }]
      parameters: [ { $ref: '#/components/parameters/AcceptLanguage' } ]
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantConfig' }
        '503': { $ref: '#/components/responses/ServiceDisabled' }

  /api/v1/assistant/conversations:
    post:
      tags: [assistant]
      operationId: createConversation
      summary: Create a conversation
      parameters: [ { $ref: '#/components/parameters/AcceptLanguage' }, { $ref: '#/components/parameters/CorrelationId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationRequest' }
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceDisabled' }

  /api/v1/assistant/conversations/{conversationId}:
    parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
    get:
      tags: [assistant]
      operationId: getConversation
      summary: Retrieve a conversation with its messages
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [assistant]
      operationId: eraseConversation
      summary: Erase a conversation (data-subject right)
      responses:
        '204': { description: Erased }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/assistant/conversations/{conversationId}/messages:
    post:
      tags: [assistant]
      operationId: sendMessage
      summary: Send a message and stream the answer (SSE)
      description: |
        Returns `text/event-stream`. The normative event grammar is:

        1. `accepted` — message persisted, `{messageId, conversationId, locale, dir}`
        2. `status`* — pipeline stage labels, localised
        3. `sources` — citations, **always before the first token**
        4. `token`* — incremental answer deltas
        5. exactly one of `answer` | `refusal` | `error`
        6. `done` — terminal, with token counters

        Re-submitting with the same `Idempotency-Key` returns the persisted answer instead of
        regenerating. `Last-Event-ID` resumption is not supported in v1.
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - { $ref: '#/components/parameters/CorrelationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '200':
          description: SSE stream
          headers:
            X-Correlation-Id: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SseAccepted'
                  - $ref: '#/components/schemas/SseStatus'
                  - $ref: '#/components/schemas/SseSources'
                  - $ref: '#/components/schemas/SseToken'
                  - $ref: '#/components/schemas/SseAnswer'
                  - $ref: '#/components/schemas/SseRefusal'
                  - $ref: '#/components/schemas/SseError'
                  - $ref: '#/components/schemas/SseDone'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }

  /api/v1/assistant/messages/{messageId}/feedback:
    post:
      tags: [assistant]
      operationId: submitFeedback
      summary: Rate an answer
      parameters:
        - { $ref: '#/components/parameters/MessageId' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackRequest' }
      responses:
        '201':
          description: Feedback recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feedback' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/assistant/messages/{messageId}/sources:
    get:
      tags: [assistant]
      operationId: getMessageSources
      summary: Full citation detail for an answer
      parameters: [ { $ref: '#/components/parameters/MessageId' }, { $ref: '#/components/parameters/AcceptLanguage' } ]
      responses:
        '200':
          description: Citations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Citation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/assistant/conversations/{conversationId}/handoff:
    post:
      tags: [assistant]
      operationId: requestHandoff
      summary: Escalate to a human advisor or a branch
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffRequest' }
      responses:
        '201':
          description: Handoff created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handoff' }

  /api/v1/assistant/fatwa-requests:
    post:
      tags: [assistant]
      operationId: createFatwaRequest
      summary: Submit a question to the Islamic Banking Standards Compliance Committee
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FatwaRequestInput' }
      responses:
        '201':
          description: Request registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FatwaRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/public/kb/search:
    get:
      tags: [public]
      operationId: searchPublicKb
      summary: Search published knowledge directly (transparency surface)
      security: [{}, { keycloakJwt: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 300 } }
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - { name: collection, in: query, schema: { type: string } }
        - { name: product, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KbSearchPage' }

  /api/v1/public/documents/{documentId}:
    get:
      tags: [public]
      operationId: getPublicDocument
      summary: Read a published document
      security: [{}, { keycloakJwt: [] }]
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicDocument' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/public/agencies:
    get:
      tags: [public]
      operationId: listAgencies
      summary: Branch and agency locator data
      security: [{}, { keycloakJwt: [] }]
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - { name: region, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Agencies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agency' }

  # ───────────────────────────────────────────── BACKOFFICE ──────────────────────────────────────
  /api/v1/admin/documents:
    get:
      tags: [admin-documents]
      operationId: listDocuments
      summary: List documents
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' },
                    { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/AcceptLanguage' },
                    { name: q, in: query, schema: { type: string } },
                    { name: collection, in: query, schema: { type: string } },
                    { name: state, in: query, schema: { $ref: '#/components/schemas/LifecycleState' } },
                    { name: product, in: query, schema: { type: string } },
                    { name: lang, in: query, schema: { type: string } },
                    { name: audience, in: query, schema: { $ref: '#/components/schemas/Audience' } },
                    { name: expiresWithinDays, in: query, schema: { type: integer } } ]
      responses:
        '200':
          description: Page of documents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-documents]
      operationId: createDocument
      summary: Upload a new document (multipart)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, collectionCode, titleFr]
              properties:
                file: { type: string, format: binary }
                collectionCode: { type: string }
                externalRef: { type: string }
                titleFr: { type: string }
                titleAr: { type: string }
                titleEn: { type: string }
                sourceLang: { type: string, example: fr-FR }
                classification: { $ref: '#/components/schemas/Classification' }
                audience: { $ref: '#/components/schemas/Audience' }
                productCodes:
                  type: array
                  items: { type: string }
                  style: form
                  explode: true
                validFrom: { type: string, format: date }
                validTo: { type: string, format: date }
                chunkingPolicy: { type: string, example: PRODUCT_SHEET }
      responses:
        '202':
          description: Document created and ingestion queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415':
          description: Unsupported format
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/admin/documents/{documentId}:
    parameters: [ { $ref: '#/components/parameters/DocumentId' } ]
    get:
      tags: [admin-documents]
      operationId: getDocument
      summary: Document detail with versions and state
      responses:
        '200':
          description: Document
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin-documents]
      operationId: updateDocumentMetadata
      summary: Update metadata (creates no new content version)
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentMetadataPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDetail' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/documents/{documentId}/versions:
    post:
      tags: [admin-documents]
      operationId: createDocumentVersion
      summary: Create a new content version (never mutates an existing one)
      parameters: [ { $ref: '#/components/parameters/DocumentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDocumentVersionRequest' }
      responses:
        '201':
          description: Version created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }

  /api/v1/admin/documents/{documentId}/chunks:
    get:
      tags: [admin-documents]
      operationId: listChunks
      summary: List chunks of the current (or a given) version
      parameters:
        - { $ref: '#/components/parameters/DocumentId' }
        - { name: versionNo, in: query, schema: { type: integer } }
        - { name: lang, in: query, schema: { type: string } }
      responses:
        '200':
          description: Chunks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Chunk' }

  /api/v1/admin/chunks/{chunkId}:
    parameters: [ { name: chunkId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [admin-documents]
      operationId: getChunk
      summary: Chunk as stored, as normalised, and as the model sees it
      responses:
        '200':
          description: Chunk detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChunkDetail' }
    patch:
      tags: [admin-documents]
      operationId: patchChunk
      summary: Edit a chunk (creates a new document version and re-enters review)
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
                headingPath: { type: array, items: { type: string } }
                lang: { type: string }
      responses:
        '201':
          description: New version created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/documents/{documentId}/withdraw:
    post:
      tags: [admin-documents]
      operationId: withdrawDocument
      summary: Emergency removal from retrieval (opens an incident)
      parameters: [ { $ref: '#/components/parameters/DocumentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                severity: { type: string, enum: [S1, S2, S3, S4], default: S2 }
      responses:
        '200': { description: Withdrawn }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/documents/{documentId}/deprecate:
    post:
      tags: [admin-documents]
      operationId: deprecateDocument
      summary: Deprecate a document (stops retrieval at `valid_to` or immediately)
      parameters: [ { $ref: '#/components/parameters/DocumentId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                effectiveAt: { type: string, format: date-time }
                reason: { type: string }
      responses:
        '200': { description: Deprecated }

  /api/v1/admin/ingestion-jobs:
    get:
      tags: [admin-ingestion]
      operationId: listIngestionJobs
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' },
                    { name: status, in: query, schema: { $ref: '#/components/schemas/JobStatus' } } ]
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionJobPage' }
    post:
      tags: [admin-ingestion]
      operationId: triggerIngestionJob
      summary: Trigger ingestion or re-indexing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestionJobRequest' }
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionJob' }

  /api/v1/admin/ingestion-jobs/{jobId}:
    get:
      tags: [admin-ingestion]
      operationId: getIngestionJob
      parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionJob' }

  /api/v1/admin/ingestion-jobs/{jobId}/retry:
    post:
      tags: [admin-ingestion]
      operationId: retryIngestionJob
      parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '202': { description: Retried }

  /api/v1/admin/reviews:
    get:
      tags: [admin-reviews]
      operationId: listReviews
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { name: assignee, in: query, schema: { type: string, enum: [me, all] } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/ReviewState' } }
        - { name: tier, in: query, schema: { $ref: '#/components/schemas/RiskTier' } }
        - { name: overdue, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
    post:
      tags: [admin-reviews]
      operationId: submitReview
      summary: Submit a subject for review
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitReviewRequest' }
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/admin/reviews/{reviewId}:
    get:
      tags: [admin-reviews]
      operationId: getReview
      parameters: [ { $ref: '#/components/parameters/ReviewId' } ]
      responses:
        '200':
          description: Review with tasks and subject diff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDetail' }

  /api/v1/admin/reviews/{reviewId}/tasks/{taskId}/decision:
    post:
      tags: [admin-reviews]
      operationId: decideReviewTask
      summary: Record an approval decision (two-eyes enforced)
      parameters:
        - { $ref: '#/components/parameters/ReviewId' }
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewDecisionRequest' }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Governance violation (self-approval, quorum, invalid transition)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/admin/reviews/{reviewId}/refer-to-committee:
    post:
      tags: [admin-reviews]
      operationId: referToCommittee
      parameters: [ { $ref: '#/components/parameters/ReviewId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
                committeeMeetingDate: { type: string, format: date }
      responses:
        '200': { description: Referred }

  /api/v1/admin/documents/{documentId}/publish:
    post:
      tags: [admin-reviews]
      operationId: publishDocument
      summary: Publish an approved version (atomic state + index + cache epoch + audit)
      parameters: [ { $ref: '#/components/parameters/DocumentId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionNo]
              properties:
                versionNo: { type: integer }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishResult' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/admin/fatwa-requests:
    get:
      tags: [admin-reviews]
      operationId: listFatwaRequests
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' },
                    { name: state, in: query, schema: { type: string, enum: [OPEN, ASSIGNED, ANSWERED, PUBLISHED_AS_KB, CLOSED] } } ]
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: array, items: { $ref: '#/components/schemas/FatwaRequest' } }
                  page: { $ref: '#/components/schemas/PageMeta' }

  /api/v1/admin/fatwa-requests/{requestId}/answer:
    post:
      tags: [admin-reviews]
      operationId: answerFatwaRequest
      parameters: [ { name: requestId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answerFr, answerAr]
              properties:
                answerFr: { type: string }
                answerAr: { type: string }
                answerEn: { type: string }
                committeeRef: { type: string }
                notifyCustomer: { type: boolean, default: false }
      responses:
        '200': { description: Answered }

  /api/v1/admin/fatwa-requests/{requestId}/publish-as-document:
    post:
      tags: [admin-reviews]
      operationId: publishFatwaAsDocument
      summary: Turn a committee answer into a T3 knowledge document
