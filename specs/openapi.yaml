components:
  securitySchemes:
    keycloakJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token. Roles come from `realm_access.roles`; retrieval scope from group attributes.

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema: { type: string, enum: [fr-FR, ar-TN, en-GB], default: fr-FR }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, default: 25, minimum: 1, maximum: 200 }
    Sort:
      name: sort
      in: query
      schema: { type: string, example: updatedAt,desc }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PromptVersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Validation failure
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Insufficient authority (or MFA step-up required)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Optimistic-lock or state conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Business or governance rule violation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProviderUnavailable:
      description: Provider unavailable, rate limited or budget exhausted — degradation ladder engaged
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceDisabled:
      description: The assistant is disabled by the kill switch
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ─────────────── enums ───────────────
    Locale:
      type: string
      enum: [fr-FR, ar-TN, en-GB]
    Direction:
      type: string
      enum: [ltr, rtl]
    LifecycleState:
      type: string
      enum: [DRAFT, IN_REVIEW, CHANGES_REQUESTED, SHARIA_APPROVED, PUBLISHED, DEPRECATED, WITHDRAWN, RETIRED]
    ReviewState:
      type: string
      enum: [PENDING, IN_REVIEW, CHANGES_REQUESTED, APPROVED, REJECTED, WITHDRAWN]
    RiskTier:
      type: string
      enum: [T1_LOW, T2_MEDIUM, T3_HIGH]
    Audience:
      type: string
      enum: [PUBLIC, AGENT, INTERNAL]
    Classification:
      type: string
      enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
    Channel:
      type: string
      enum: [WEB_APP, WIDGET, AGENT_DESK, API]
    JobStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    FeedbackRating:
      type: string
      enum: [UP, DOWN, SHARIA_CONCERN, FACTUAL_ERROR, WRONG_LANGUAGE, INCOMPLETE, OFFENSIVE]
    RefusalCode:
      type: string
      enum: [REF-01, REF-02, REF-03, REF-04, REF-05, REF-06]
      description: |
        REF-01 abuse/injection · REF-02 prohibited topic · REF-03 no-fatwa ·
        REF-04 personal/account data out of scope · REF-05 not in approved knowledge ·
        REF-06 out of scope (other bank, general advice)
    Intent:
      type: string
      enum: [PRODUCT_QUESTION, PRODUCT_COMPARISON, SHARIA_CONCEPT, RELIGIOUS_RULING_REQUEST, PROCEDURE,
             TARIFF_FEES, BRANCH_LOCATOR, DIGITAL_CHANNEL, ACCOUNT_STATUS, COMPLAINT, SMALL_TALK,
             OUT_OF_SCOPE, ABUSE, ADVERSARIAL]

    # ─────────────── common ───────────────
    Problem:
      type: object
      description: RFC 9457 problem details, extended with a stable bank code and trilingual titles
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        title_ar: { type: string }
        title_en: { type: string }
        status: { type: integer }
        code: { type: string, example: RAG.NO_APPROVED_CONTENT }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string, format: uuid }
        refusalCode: { $ref: '#/components/schemas/RefusalCode' }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    PageMeta:
      type: object
      properties:
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    LocalizedText:
      type: object
      properties:
        fr: { type: string }
        ar: { type: string }
        en: { type: string }

    # ─────────────── frontoffice ───────────────
    AssistantConfig:
      type: object
      properties:
        assistantName: { type: string, example: Al-Mouchir }
        enabled: { type: boolean }
        mode: { type: string, enum: [ON, AGENTS_ONLY, OFF] }
        locales: { type: array, items: { $ref: '#/components/schemas/Locale' } }
        defaultLocale: { $ref: '#/components/schemas/Locale' }
        suggestedQuestions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              locale: { $ref: '#/components/schemas/Locale' }
              text: { type: string }
              intent: { type: string }
        disclaimers:
          type: array
          items:
            type: object
            properties:
              id: { type: string, example: DISC-GENERAL }
              locale: { $ref: '#/components/schemas/Locale' }
              text: { type: string }
        piiWarning: { $ref: '#/components/schemas/LocalizedText' }
        featureFlags:
          type: object
          properties:
            voiceInput: { type: boolean }
            widgetEnabled: { type: boolean }
            handoffEnabled: { type: boolean }
            fatwaRequestEnabled: { type: boolean }
            publicKbSearch: { type: boolean }
        limits:
          type: object
          properties:
            maxMessageChars: { type: integer, example: 4000 }
            maxTurnsPerConversation: { type: integer, example: 20 }
            messagesPerMinute: { type: integer, example: 6 }
        support:
          type: object
          properties:
            phone: { type: string }
            hoursFr: { type: string }
            hoursAr: { type: string }
            hoursEn: { type: string }
    CreateConversationRequest:
      type: object
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        locale: { $ref: '#/components/schemas/Locale' }
        pageContext: { type: string, description: Optional originating page URL passed by the widget host }
    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/Channel' }
        locale: { $ref: '#/components/schemas/Locale' }
        dir: { $ref: '#/components/schemas/Direction' }
        state: { type: string, enum: [ACTIVE, ARCHIVED, ESCALATED, CLOSED] }
        startedAt: { type: string, format: date-time }
        limits:
          type: object
          properties:
            maxTurns: { type: integer }
            remainingTurns: { type: integer }
    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          properties:
            messages: { type: array, items: { $ref: '#/components/schemas/Message' } }
            nextCursor: { type: [string, 'null'] }
    SendMessageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }
        locale: { $ref: '#/components/schemas/Locale' }
        clientId: { type: string, description: Client-side message id for optimistic rendering }
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        ordinal: { type: integer }
        role: { type: string, enum: [USER, ASSISTANT, SYSTEM, AGENT] }
        content: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        dir: { $ref: '#/components/schemas/Direction' }
        intent: { $ref: '#/components/schemas/Intent' }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        refusalCode: { $ref: '#/components/schemas/RefusalCode' }
        disclaimers: { type: array, items: { type: string } }
        needsHuman: { type: boolean }
        createdAt: { type: string, format: date-time }
    Citation:
      type: object
      properties:
        id: { type: string, example: S1 }
        chunkId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        documentTitle: { type: string }
        documentTitleLocale: { $ref: '#/components/schemas/Locale' }
        collectionCode: { type: string }
        headingPath: { type: array, items: { type: string } }
        excerpt: { type: string }
        url: { type: string, example: /api/v1/public/documents/…#S1 }
        locale: { $ref: '#/components/schemas/Locale' }
        validFrom: { type: [string, 'null'], format: date }
        validUntil: { type: [string, 'null'], format: date }
        score: { type: number, format: float }
    FeedbackRequest:
      type: object
      required: [rating]
      properties:
        rating: { $ref: '#/components/schemas/FeedbackRating' }
        comment: { type: string, maxLength: 1000 }
        contactOptIn: { type: boolean, default: false }
        contact: { type: string, description: Only stored if `contactOptIn` is true }
    Feedback:
      type: object
      properties:
        id: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        rating: { $ref: '#/components/schemas/FeedbackRating' }
        comment: { type: string }
        status: { type: string, enum: [NEW, TRIAGED, IN_PROGRESS, RESOLVED, DISMISSED] }
        resolutionRef: { type: string }
        createdAt: { type: string, format: date-time }
    HandoffRequest:
      type: object
      properties:
        reason: { type: string }
        preferredChannel: { type: string, enum: [CALL, BRANCH, EMAIL] }
        agencyCode: { type: string }
        contact: { type: string }
    Handoff:
      type: object
      properties:
        ref: { type: string }
        state: { type: string }
        createdAt: { type: string, format: date-time }
    FatwaRequestInput:
      type: object
      required: [question]
      properties:
        question: { type: string, maxLength: 2000 }
        locale: { $ref: '#/components/schemas/Locale' }
        conversationId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        contact: { type: string }
    FatwaRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        ref: { type: string, example: FR-2026-00123 }
        state: { type: string, enum: [OPEN, ASSIGNED, ANSWERED, PUBLISHED_AS_KB, CLOSED] }
        questionFr: { type: string }
        questionAr: { type: string }
        questionEn: { type: string }
        slaDueAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    KbSearchPage:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
            properties:
              documentId: { type: string, format: uuid }
              chunkId: { type: string, format: uuid }
              title: { type: string }
              headingPath: { type: array, items: { type: string } }
              excerpt: { type: string }
              locale: { $ref: '#/components/schemas/Locale' }
              score: { type: number }
              validUntil: { type: [string, 'null'], format: date }
        page: { $ref: '#/components/schemas/PageMeta' }
    PublicDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        collectionCode: { type: string }
        productCodes: { type: array, items: { type: string } }
        locale: { $ref: '#/components/schemas/Locale' }
        bodyMarkdown: { type: string }
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date }
        versionNo: { type: integer }
    Agency:
      type: object
      properties:
        code: { type: string }
        nameFr: { type: string }
        nameAr: { type: string }
        nameEn: { type: string }
        region: { type: string }
        address: { type: string }
        phone: { type: string }
        lat: { type: number }
        lon: { type: number }
        hours: { type: string }

    # ─────────────── SSE events ───────────────
    SseAccepted:
      type: object
      description: 'event: accepted'
      properties:
        event: { type: string, const: accepted }
        data:
          type: object
          properties:
            messageId: { type: string, format: uuid }
            conversationId: { type: string, format: uuid }
            locale: { $ref: '#/components/schemas/Locale' }
            dir: { $ref: '#/components/schemas/Direction' }
    SseStatus:
      type: object
      description: 'event: status'
      properties:
        event: { type: string, const: status }
        data:
          type: object
          properties:
            stage: { type: string, enum: [SCREENING, RETRIEVING, RERANKING, GENERATING, VERIFYING] }
            label: { type: string }
    SseSources:
      type: object
      description: 'event: sources — always emitted before the first token'
      properties:
        event: { type: string, const: sources }
        data:
          type: object
          properties:
            citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
    SseToken:
      type: object
      description: 'event: token'
      properties:
        event: { type: string, const: token }
        data:
          type: object
          properties:
            delta: { type: string }
    SseAnswer:
      type: object
      description: 'event: answer — terminal'
      properties:
        event: { type: string, const: answer }
        data: { $ref: '#/components/schemas/AnswerPayload' }
    SseRefusal:
      type: object
      description: 'event: refusal — terminal'
      properties:
        event: { type: string, const: refusal }
        data: { $ref: '#/components/schemas/RefusalPayload' }
    SseError:
      type: object
      description: 'event: error — terminal'
      properties:
        event: { type: string, const: error }
        data:
          type: object
          properties:
            code: { type: string }
            retryAfterMs: { type: integer }
            degradationStep: { type: integer, minimum: 1, maximum: 5 }
    SseDone:
      type: object
      description: 'event: done — always last'
      properties:
        event: { type: string, const: done }
        data:
          type: object
          properties:
            messageId: { type: string, format: uuid }
            tokensIn: { type: integer }
            tokensOut: { type: integer }
            latencyMs: { type: integer }
    AnswerPayload:
      type: object
      properties:
        messageId: { type: string, format: uuid }
        answerMarkdown: { type: string }
        language: { $ref: '#/components/schemas/Locale' }
        dir: { $ref: '#/components/schemas/Direction' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        usedSources: { type: array, items: { type: string } }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        caveats: { type: array, items: { type: string } }
        disclaimers: { type: array, items: { type: string } }
        needsHuman: { type: boolean }
        cached: { type: boolean }
        models:
          type: object
          properties:
            chat: { type: string }
            reranker: { type: string }
            degradationStep: { type: integer }
        latencyMs: { type: integer }
        ttftMs: { type: integer }
    RefusalPayload:
      type: object
      properties:
        messageId: { type: string, format: uuid }
        refusalCode: { $ref: '#/components/schemas/RefusalCode' }
        title: { type: string }
        body: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        sources: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        fatwaRequestRef: { type: [string, 'null'] }
        handoffAvailable: { type: boolean }

    # ─────────────── knowledge ───────────────
    DocumentSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        titleAr: { type: string }
        collectionCode: { type: string }
        productCodes: { type: array, items: { type: string } }
        sourceLang: { $ref: '#/components/schemas/Locale' }
        audience: { $ref: '#/components/schemas/Audience' }
        classification: { $ref: '#/components/schemas/Classification' }
        lifecycleState: { $ref: '#/components/schemas/LifecycleState' }
        currentVersionNo: { type: integer }
        chunkCount: { type: integer }
        validFrom: { type: [string, 'null'], format: date }
        validTo: { type: [string, 'null'], format: date }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
    DocumentDetail:
      allOf:
        - $ref: '#/components/schemas/DocumentSummary'
        - type: object
          properties:
            externalRef: { type: string }
            titleFr: { type: string }
            titleEn: { type: string }
            sourceUri: { type: string }
            mimeType: { type: string }
            sizeBytes: { type: integer }
            sha256: { type: string }
            ownerRole: { type: string }
            versions: { type: array, items: { $ref: '#/components/schemas/DocumentVersion' } }
            reviews: { type: array, items: { $ref: '#/components/schemas/Review' } }
    DocumentPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } }
        page: { $ref: '#/components/schemas/PageMeta' }
    DocumentMetadataPatch:
      type: object
      properties:
        titleFr: { type: string }
        titleAr: { type: string }
        titleEn: { type: string }
        collectionCode: { type: string }
        productCodes: { type: array, items: { type: string } }
        audience: { $ref: '#/components/schemas/Audience' }
        classification: { $ref: '#/components/schemas/Classification' }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        ownerRole: { type: string }
    CreateDocumentVersionRequest:
      type: object
      required: [bodyText]
      properties:
        bodyText: { type: string }
        bodyLang: { $ref: '#/components/schemas/Locale' }
        changeSummary: { $ref: '#/components/schemas/LocalizedText' }
        chunkingPolicy: { type: string, enum: [PRODUCT_SHEET, TARIFF_TABLE, PROCEDURE, SHARIA_NOTE, FAQ, REGULATION, GENERIC] }
    DocumentVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        versionNo: { type: integer }
        state: { $ref: '#/components/schemas/LifecycleState' }
        bodyLang: { $ref: '#/components/schemas/Locale' }
        changeSummary: { $ref: '#/components/schemas/LocalizedText' }
        chunkCount: { type: integer }
        publishedAt: { type: [string, 'null'], format: date-time }
        publishedBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        etag: { type: string }
    Chunk:
      type: object
      properties:
        id: { type: string, format: uuid }
        documentVersionId: { type: string, format: uuid }
        ordinal: { type: integer }
        content: { type: string }
        headingPath: { type: array, items: { type: string } }
        tokenCount: { type: integer }
        lang: { $ref: '#/components/schemas/Locale' }
        isTranslation: { type: boolean }
        machineTranslated: { type: boolean }
        sourceChunkId: { type: [string, 'null'], format: uuid }
        searchable: { type: boolean }
        embeddingStatus: { type: string, enum: [PENDING, EMBEDDED, FAILED, STALE] }
        embeddingModel: { type: string }
        embeddingDim: { type: integer }
        forbiddenRenderingHits: { type: array, items: { type: string } }
    ChunkDetail:
      allOf:
        - $ref: '#/components/schemas/Chunk'
        - type: object
          properties:
            normalizedText: { type: string }
            tsvTokens: { type: array, items: { type: string } }
            asTheModelSeesIt: { type: string, description: Contextual header + content, exactly as embedded }
            translations: { type: array, items: { $ref: '#/components/schemas/Chunk' } }
            lastCitedBy: { type: array, items: { type: string, format: uuid } }
    PublishResult:
      type: object
      properties:
        documentId: { type: string, format: uuid }
        versionNo: { type: integer }
        publishedAt: { type: string, format: date-time }
        chunksMadeSearchable: { type: integer }
        kbEpoch: { type: integer }
        evalRunRequired: { type: boolean }
    IngestionJobRequest:
      type: object
      properties:
        type: { type: string, enum: [INGEST_DOCUMENT, RECHUNK, REEMBED, REINDEX_MODEL_CHANGE, TRANSLATE] }
        documentId: { type: string, format: uuid }
        embeddingModel: { type: string }
        embeddingDim: { type: integer }
        priority: { type: string, enum: [LOW, NORMAL, HIGH], default: NORMAL }
    IngestionJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        stage: { type: string, enum: [PARSE, CLEAN, CHUNK, NORMALISE, TRANSLATE, EMBED, STORE, DONE] }
        progress: { type: number, minimum: 0, maximum: 1 }
        documentId: { type: [string, 'null'], format: uuid }
        attempts: { type: integer }
        error: { type: [string, 'null'] }
        quarantineReason: { type: [string, 'null'], description: Set when Prompt Guard flagged the content at ingestion }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    IngestionJobPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/IngestionJob' } }
        page: { $ref: '#/components/schemas/PageMeta' }

    # ─────────────── governance ───────────────
    SubmitReviewRequest:
      type: object
      required: [subjectType, subjectId]
      properties:
        subjectType: { type: string, enum: [DOCUMENT_VERSION, PROMPT_VERSION, GUARDRAIL_POLICY, GLOSSARY_TERM, RETRIEVAL_CONFIG, MODEL_CONFIG] }
        subjectId: { type: string, format: uuid }
        requestedTier: { $ref: '#/components/schemas/RiskTier' }
        note: { $ref: '#/components/schemas/LocalizedText' }
    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        ref: { type: string, example: R-2026-0143 }
        subjectType: { type: string }
        subjectId: { type: string, format: uuid }
        subjectLabel: { type: string }
        riskTier: { $ref: '#/components/schemas/RiskTier' }
        state: { $ref: '#/components/schemas/ReviewState' }
        submittedBy: { type: string }
        submittedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionReason: { $ref: '#/components/schemas/LocalizedText' }
        committeeRef: { type: [string, 'null'] }
        tasks: { type: array, items: { $ref: '#/components/schemas/ReviewTask' } }
    ReviewDetail:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          properties:
            riskFactors: { type: array, items: { type: string } }
            diff:
              type: object
              properties:
                before: { type: string }
                after: { type: string }
                hunks: { type: array, items: { type: object } }
            chunks: { type: array, items: { $ref: '#/components/schemas/Chunk' } }
            glossaryViolations: { type: array, items: { type: string } }
            previewAvailable: { type: boolean }
    ReviewTask:
      type: object
      properties:
        id: { type: string, format: uuid }
        assigneeRole: { type: string }
        assigneeId: { type: [string, 'null'] }
        required: { type: boolean }
        decision: { type: [string, 'null'], enum: [APPROVE, REQUEST_CHANGES, REJECT] }
        comments: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
    ReviewDecisionRequest:
      type: object
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [APPROVE, REQUEST_CHANGES, REJECT] }
        reason: { $ref: '#/components/schemas/LocalizedText' }
        scope: { type: string, enum: [ALL_CHUNKS, SELECTED_CHUNKS], default: ALL_CHUNKS }
        chunkIds: { type: array, items: { type: string, format: uuid } }
    ReviewPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/Review' } }
        page: { $ref: '#/components/schemas/PageMeta' }
    ConversationPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
        page: { $ref: '#/components/schemas/PageMeta' }

    # ─────────────── tuning ───────────────
    PromptTemplate:
      type: object
      properties:
        code: { type: string, enum: [SYSTEM_ASSISTANT, SYSTEM_RERANKER, QUERY_REWRITE, INTENT_CLASSIFIER, GUARDRAIL_JUDGE, EVAL_JUDGE, ANSWER_CONTRACT, SUMMARIZER] }
        locale: { type: string }
        description: { type: string }
        activeVersionNo: { type: integer }
        requiresShariaApproval: { type: boolean }
    PromptVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        locale: { type: string }
        versionNo: { type: integer }
        state: { type: string, enum: [DRAFT, IN_REVIEW, ACTIVE, RETIRED] }
        body: { type: string }
        variables: { type: array, items: { type: string } }
        protectedClauses: { type: array, items: { type: string } }
        requiresShariaApproval: { type: boolean }
        reviewId: { type: [string, 'null'], format: uuid }
        evalRunId: { type: [string, 'null'], format: uuid }
        activatedAt: { type: [string, 'null'], format: date-time }
        activatedBy: { type: [string, 'null'] }
        etag: { type: string }
    CreatePromptVersionRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }
        locale: { type: string }
        changeNote: { $ref: '#/components/schemas/LocalizedText' }
        basedOnVersionId: { type: string, format: uuid }
    PromptVersionDetail:
      allOf:
        - $ref: '#/components/schemas/PromptVersion'
        - type: object
          properties:
            diffAgainstActive: { type: string }
            tokenEstimate: { type: integer }
            removedProtectedClauses: { type: array, items: { type: string } }
    PromptPreviewResult:
      type: object
      properties:
        comparisons:
          type: array
          items:
            type: object
            properties:
              query: { type: string }
              locale: { $ref: '#/components/schemas/Locale' }
              activeAnswer: { type: string }
              draftAnswer: { type: string }
              citationsDiffer: { type: boolean }
              guardrailDelta: { type: string }
              latencyDeltaMs: { type: integer }
    ActivateVersionRequest:
      type: object
      properties:
        canaryPercent: { type: integer, minimum: 0, maximum: 100, default: 100 }
        evalRunId: { type: string, format: uuid, description: Mandatory for T3 subjects }
        note: { type: string }
    RetrievalLabRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        audience: { $ref: '#/components/schemas/Audience' }
        channel: { $ref: '#/components/schemas/Channel' }
        retrievalConfigId: { type: [string, 'null'], format: uuid }
        promptVersionId: { type: [string, 'null'], format: uuid }
        modelConfigId: { type: [string, 'null'], format: uuid }
        overrides: { $ref: '#/components/schemas/RetrievalConfig' }
        generate: { type: boolean, default: true }
        includeInReviewContent: { type: boolean, default: false, description: Watermarked preview for reviewers }
    RetrievalLabResult:
      type: object
      properties:
        traceId: { type: string, format: uuid }
        language: { $ref: '#/components/schemas/Locale' }
        intent: { $ref: '#/components/schemas/Intent' }
        normalizedQuery: { type: string }
        expandedQueries: { type: array, items: { type: string } }
        candidates: { type: array, items: { $ref: '#/components/schemas/RetrievalCandidate' } }
        contextTokens: { type: integer }
        budgetTokens: { type: integer }
        assembledContext: { type: array, items: { type: string } }
        answer: { $ref: '#/components/schemas/AnswerPayload' }
        guardrails:
          type: object
          properties:
            input: { type: string }
            output: { type: string }
            numericClaims: { type: object, properties: { checked: { type: integer }, ungrounded: { type: integer } } }
            violations: { type: array, items: { type: string } }
        latency:
          type: object
          properties:
            embeddingMs: { type: integer }
            searchMs: { type: integer }
            rerankMs: { type: integer }
            ttftMs: { type: integer }
            totalMs: { type: integer }
        cost:
          type: object
          properties:
            usd: { type: number }
            tokensIn: { type: integer }
            tokensOut: { type: integer }
        versions:
          type: object
          properties:
            promptVersion: { type: integer }
            retrievalConfig: { type: integer }
            modelConfig: { type: integer }
            kbEpoch: { type: integer }
    RetrievalCandidate:
      type: object
      properties:
        chunkId: { type: string, format: uuid }
        documentTitle: { type: string }
        headingPath: { type: array, items: { type: string } }
        lang: { $ref: '#/components/schemas/Locale' }
        strategy: { type: string, enum: [DENSE, FTS, TRGM] }
        rank: { type: integer }
        score: { type: number }
        rrfScore: { type: number }
        rerankScore: { type: [integer, 'null'] }
        reasonCode: { type: [string, 'null'], enum: [PRODUCT_TERMS, PROCEDURE_STEPS, TARIFF, SHARIA_BASIS, OFF_TOPIC, OUTDATED, null] }
        selected: { type: boolean }
        excludedBecause: { type: [string, 'null'], enum: [BELOW_THRESHOLD, AUDIENCE_FILTER, VALIDITY_EXPIRED, DROPPED_BY_RERANKER, DEDUPED_TRANSLATION, BUDGET, null] }
        excerpt: { type: string }
    RetrievalLabCompareRequest:
      type: object
      properties:
        queries: { type: array, items: { type: string } }
        goldenSetTag: { type: string }
        configA: { $ref: '#/components/schemas/RetrievalConfig' }
        configB: { $ref: '#/components/schemas/RetrievalConfig' }
    RetrievalLabCompareResult:
      type: object
      properties:
        metricsA: { type: object, additionalProperties: { type: number } }
        metricsB: { type: object, additionalProperties: { type: number } }
        delta: { type: object, additionalProperties: { type: number } }
        perQuery: { type: array, items: { type: object } }
    RetrievalConfig:
      type: object
      properties:
        id: { type: string, format: uuid }
        versionNo: { type: integer }
        state: { type: string, enum: [DRAFT, ACTIVE, RETIRED] }
        channel: { $ref: '#/components/schemas/Channel' }
        topKDense: { type: integer, default: 25 }
        topKFts: { type: integer, default: 20 }
        topKTrgm: { type: integer, default: 10 }
        rrfK: { type: integer, default: 60 }
        wDense: { type: number, default: 1.0 }
        wFts: { type: number, default: 0.85 }
        wTrgm: { type: number, default: 0.45 }
        minScoreDense: { type: number, default: 0.35 }
        minScoreFts: { type: number, default: 0.05 }
        rerankEnabled: { type: boolean, default: true }
        rerankTopN: { type: integer, default: 8 }
        rerankMinRelevance: { type: integer, default: 4 }
        contextTokenBudget: { type: integer, default: 6000 }
        mmrLambda: { type: number, default: 0.75 }
        hydeEnabled: { type: boolean, default: false }
        queryExpansionEnabled: { type: boolean, default: true }
        crossLingualEnabled: { type: boolean, default: true }
        crossLingualFallbackMinHits: { type: integer, default: 3 }
        boostRecentDays: { type: integer, default: 90 }
    ModelConfig:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, enum: [CHAT_PRIMARY, CHAT_FAST, CHAT_FALLBACK, RERANKER, GUARD_SAFETY, GUARD_INJECTION, EMBEDDING] }
        provider: { type: string, enum: [GROQ, GOOGLE, ONPREM] }
        modelId: { type: string, example: llama-3.3-70b-versatile }
        state: { type: string, enum: [DRAFT, ACTIVE, RETIRED] }
        temperature: { type: number }
        topP: { type: number }
        maxTokens: { type: integer }
        timeoutMs: { type: integer }
        retries: { type: integer }
        fallbackConfigId: { type: [string, 'null'], format: uuid }
        rateLimitPerMin: { type: integer }
        dailyBudgetUsd: { type: number }
        enabled: { type: boolean }
        embeddingDim: { type: [integer, 'null'] }
        taskType: { type: [string, 'null'], enum: [RETRIEVAL_QUERY, RETRIEVAL_DOCUMENT] }
    ProviderTestResult:
      type: object
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer }
        modelId: { type: string }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        costUsd: { type: number }
        error: { type: [string, 'null'] }
        sampleOutput: { type: [string, 'null'] }
    ProviderStatus:
      type: object
      properties:
        provider: { type: string }
        healthy: { type: boolean }
        circuitState: { type: string, enum: [CLOSED, OPEN, HALF_OPEN] }
        latencyP95Ms: { type: integer }
        errorRate: { type: number }
        callsToday: { type: integer }
        spendTodayUsd: { type: number }
        budgetTodayUsd: { type: number }
        degradationActive: { type: boolean }

    # ─────────────── guardrails, quality, audit ───────────────
    GuardrailPolicy:
      type: object
      properties:
        code: { type: string, enum: [PROHIBITED_TOPICS, NO_FATWA, PII_EGRESS, INJECTION, NUMERIC_CLAIMS, LANGUAGE_CONSISTENCY, HALLUCINATED_ENTITIES, RATE_LIMIT, MAX_TURNS, OUTPUT_TOXICITY] }
        versionNo: { type: integer }
        state: { type: string, enum: [DRAFT, IN_REVIEW, ACTIVE, RETIRED] }
        appliesTo: { type: string, enum: [INPUT, OUTPUT, BOTH] }
        severity: { type: string, enum: [BLOCK, WARN, LOG] }
        enabled: { type: boolean }
        params: { type: object, additionalProperties: true }
        riskTier: { $ref: '#/components/schemas/RiskTier' }
    GuardrailEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        messageId: { type: [string, 'null'], format: uuid }
        chunkId: { type: [string, 'null'], format: uuid, description: Set when the trigger was ingested content (indirect injection) }
        policyCode: { type: string }
        policyVersion: { type: integer }
        decision: { type: string, enum: [BLOCK, WARN, LOG, PASS] }
        severity: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        violationCode: { type: string }
        evidence: { type: string, description: Redacted snippet }
        refusalCode: { $ref: '#/components/schemas/RefusalCode' }
        createdAt: { type: string, format: date-time }
    EvalCase:
      type: object
      properties:
        id: { type: string, example: GS-AR-MOUR-014 }
        question: { type: string }
        questionLang: { $ref: '#/components/schemas/Locale' }
        expectedAnswerLang: { $ref: '#/components/schemas/Locale' }
        expectedIntents: { type: array, items: { $ref: '#/components/schemas/Intent' } }
        mustCiteChunks: { type: array, items: { type: string } }
        mustNotCiteChunks: { type: array, items: { type: string } }
        mustContainTerms: { type: array, items: { type: string } }
        mustNotContainTerms: { type: array, items: { type: string } }
        mustContainPatterns: { type: array, items: { type: string } }
        expectRefusalCode: { $ref: '#/components/schemas/RefusalCode' }
        referenceAnswer: { type: string }
        tags: { type: array, items: { type: string } }
        weight: { type: integer, default: 1 }
        source: { type: string }
    EvalRunRequest:
      type: object
      properties:
        scope: { type: string, enum: [PR_SUBSET, FULL, RED_TEAM_ONLY], default: FULL }
        bundle:
          type: object
          properties:
            kbEpoch: { type: integer }
            promptVersions: { type: object, additionalProperties: { type: integer } }
            retrievalConfigVersion: { type: integer }
            modelConfigVersion: { type: integer }
            guardrailPolicyVersions: { type: object, additionalProperties: { type: integer } }
        tags: { type: array, items: { type: string } }
    EvalRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        scope: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        caseCount: { type: integer }
        gate: { type: string, enum: [PASS, FAIL, RUNNING] }
        costUsd: { type: number }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    EvalScorecard:
      type: object
      properties:
        runId: { type: string, format: uuid }
        bundle: { type: object, additionalProperties: true }
        cases: { type: integer }
        duration: { type: string }
        cost: { type: number }
        gate: { type: string, enum: [PASS, FAIL] }
        scores:
          type: object
          additionalProperties:
            type: object
            properties:
              value: { type: number }
              threshold: { type: number }
              status: { type: string, enum: [PASS, FAIL, WARN] }
              previous: { type: number }
        perLocale:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: number }
        regressions:
          type: array
          items:
            type: object
            properties:
              caseId: { type: string }
              metric: { type: string }
              from: { type: number }
              to: { type: number }
              hint: { type: string }
        improvements: { type: integer }
    GlossaryTerm:
      type: object
      properties:
        id: { type: string, format: uuid }
        canonicalCode: { type: string, example: MOURABAHA }
        termFr: { type: string }
        termAr: { type: string }
        termEn: { type: string }
        transliterationAr: { type: string }
        definitionFr: { type: string }
        definitionAr: { type: string }
        definitionEn: { type: string }
        forbiddenRenderings: { type: array, items: { type: string } }
        domain: { type: string, enum: [PRODUCT, SHARIA, PROCEDURE, FINANCIAL, DIGITAL, GOVERNANCE, TECHNICAL] }
        shariaSensitive: { type: boolean }
        status: { type: string, enum: [ACTIVE, DEPRECATED] }
    AssistantConfigEntry:
      type: object
      properties:
        key: { type: string, example: suggested_questions.fr-FR }
        value: {}
        valueType: { type: string, enum: [STRING, TEXT, JSON, BOOL, INT] }
        locale: { type: [string, 'null'] }
        riskTier: { $ref: '#/components/schemas/RiskTier' }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
    AuditEvent:
      type: object
      properties:
        seq: { type: integer, format: int64 }
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actor: { type: string }
        actorRole: { type: string }
        action: { type: string, example: DOCUMENT_PUBLISH }
        subjectType: { type: string }
        subjectId: { type: string }
        before: { type: object, additionalProperties: true }
        after: { type: object, additionalProperties: true }
        reason: { type: [string, 'null'] }
        reasonCode: { type: [string, 'null'], description: Break-glass reason for personal-data access }
        correlationId: { type: string }
        prevHash: { type: string }
        hash: { type: string }
    AnalyticsOverview:
      type: object
      properties:
        period:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        conversations: { type: integer }
        messages: { type: integer }
        answeredRate: { type: number }
        refusalRate: { type: number }
        thumbsUpRate: { type: number }
        thumbsDownRate: { type: number }
        byLocale: { type: object, additionalProperties: { type: integer } }
        byChannel: { type: object, additionalProperties: { type: integer } }
        byIntent: { type: object, additionalProperties: { type: integer } }
        byRefusalCode: { type: object, additionalProperties: { type: integer } }
        latencyP50Ms: { type: integer }
        latencyP95Ms: { type: integer }
        cacheHitRate: { type: number }
        costUsd: { type: number }
        costPerAnswerUsd: { type: number }
        degradationSteps: { type: object, additionalProperties: { type: integer } }
    ReleaseBundle:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        gitSha: { type: string }
        imageTag: { type: string }
        kbEpoch: { type: integer }
        promptVersions: { type: object, additionalProperties: { type: integer } }
        retrievalConfigVersion: { type: integer }
        modelConfigVersions: { type: object, additionalProperties: { type: integer } }
        guardrailPolicyVersions: { type: object, additionalProperties: { type: integer } }
        evalRunId: { type: [string, 'null'], format: uuid }
        gate: { type: string, enum: [PASS, FAIL, PENDING] }
        approvals: { type: array, items: { type: string } }
        environments: { type: array, items: { type: string, enum: [dev, uat, prod] } }
        createdAt: { type: string, format: date-time }
