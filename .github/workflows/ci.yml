name: CI — Spring + Python + Angular build & full-stack smoke

on:
  push:
    branches: [arena/01a06861-albaraka-ai, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# debugging channel: devstack may commit ci-logs/latest.txt on boot failure (repos read via git)
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  #  server — the exact build the Dockerfile runs (mvn -pl assistant-boot -am package)
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile Spring Boot modular monolith (same command as Dockerfile.server)
        run: |
          mvn -B -pl assistant-boot -am package -DskipTests 2>&1 | tee /tmp/server-build.log
          exit ${PIPESTATUS[0]}
        working-directory: server
      - name: Emit build log as annotations (API-readable)
        if: failure()
        run: |
          grep -inE "error|exception|cannot find|failed|build failure|exit code|fatal|missing|not found" /tmp/server-build.log \
            | tail -n 40 | sed 's/^/::error file=server-build.log::/'
      - name: Upload server build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: server-build-log
          path: /tmp/server-build.log

  # ─────────────────────────────────────────────────────────────────────────────────────────────
  #  rag-assistant — pip install + the 8-case golden gate
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  rag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rag-assistant
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package (dev extras — pytest + httpx)
        run: pip install -e '.[dev]' 2>&1 | tee /tmp/rag-pip.log && test ${PIPESTATUS[0]} -eq 0
      - name: Golden gate (mock mode, no keys)
        run: python -m pytest -q 2>&1 | tee /tmp/rag-pytest.log && test ${PIPESTATUS[0]} -eq 0
      - name: Emit rag logs as annotations (API-readable)
        if: failure()
        run: |
          grep -inE "error|exception|failed|assert|missing|not found|traceback" /tmp/rag-*.log \
            | tail -n 40 | sed 's/^/::error file=rag.log::/'
      - name: Upload rag logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: rag-build-log
          path: /tmp/rag-*.log

  # ─────────────────────────────────────────────────────────────────────────────────────────────
  #  web — Angular 22: shared-ui + both production bundles (backoffice under /admin/)
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/package-lock.json
      - name: Build shared-ui + frontoffice + backoffice
        run: |
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/web-npm.log
          npm run build:ui 2>&1 | tee -a /tmp/web-build.log
          npx ng build frontoffice-web --configuration production 2>&1 | tee -a /tmp/web-build.log
          npx ng build backoffice-web --configuration production --base-href /admin/ --deploy-url /admin/ 2>&1 | tee -a /tmp/web-build.log
      - name: Emit web logs as annotations (API-readable)
        if: failure()
        run: |
          grep -inE "error|exception|failed|cannot find|fatal" /tmp/web-*.log \
            | tail -n 40 | sed 's/^/::error file=web.log::/'
      - name: Upload web logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: web-build-log
          path: /tmp/web-*.log

  # ─────────────────────────────────────────────────────────────────────────────────────────────
  #  gates — spec linters with mutation self-tests
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: compose-lint + self-test
        run: |
          cd tools/compose-lint && npm ci --no-audit --no-fund
          node lint.mjs && node self-test.mjs 2>&1 | tee /tmp/gates-compose.log
      - name: config-lint + self-test
        run: |
          cd tools/config-lint && npm ci --no-audit --no-fund
          node lint.mjs && node self-test.mjs 2>&1 | tee /tmp/gates-config.log
      - name: seed-gen staleness check
        run: |
          cd tools/seed-gen && npm ci --no-audit --no-fund
          cd "$GITHUB_WORKSPACE" && node tools/seed-gen/generate.mjs --check 2>&1 | tee /tmp/gates-seedgen.log
      - name: realm-lint + self-test
        run: |
          cd tools/realm-lint && npm ci --no-audit --no-fund
          node lint.mjs && node self-test.mjs 2>&1 | tee /tmp/gates-realm.log
      - name: Emit gates logs as annotations (API-readable)
        if: failure()
        run: |
          grep -inE "error|exception|failed|missing|not found|MISSED|BROKEN|MODULE_NOT_FOUND" /tmp/gates-*.log \
            | tail -n 40 | sed 's/^/::error file=gates.log::/'
      - name: Upload gates logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gates-log
          path: /tmp/gates-*.log

  # ─────────────────────────────────────────────────────────────────────────────────────────────
  #  devstack — real end-to-end: builds every image and boots the compose stack, then probes
  #  Spring + RAG health. Logs are tee'd, emitted as annotations and uploaded so the iteration
  #  loop can read them even when GitHub's log service is unavailable.
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  devstack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      POSTGRES_PASSWORD: ci-postgres
      KC_BOOTSTRAP_ADMIN_PASSWORD: ci-admin
      MINIO_ROOT_PASSWORD: ci-minio
      RAG_PROVIDER_MODE: mock
      RAG_VECTOR_BACKEND: mock
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap .env for CI
        run: |
          sed "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$POSTGRES_PASSWORD/
               s/^KC_BOOTSTRAP_ADMIN_PASSWORD=.*/KC_BOOTSTRAP_ADMIN_PASSWORD=$KC_BOOTSTRAP_ADMIN_PASSWORD/
               s/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD/" .env.example > .env
          grep -E "^(POSTGRES_PASSWORD|KC_BOOTSTRAP_ADMIN_PASSWORD|MINIO_ROOT_PASSWORD)=" .env
      - name: Build all images
        run: |
          docker compose --env-file .env -f deploy/docker-compose.yml --profile app build 2>&1 | tee /tmp/devstack-build.log
          exit ${PIPESTATUS[0]}
      - name: Boot the application
        run: |
          set -o pipefail
          docker compose --env-file .env -f deploy/docker-compose.yml --profile app up -d --no-build 2>&1 | tee /tmp/devstack-boot.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "── compose up failed; keycloak log ──" | tee -a /tmp/devstack-boot.log
            docker compose --env-file .env -f deploy/docker-compose.yml --profile app logs keycloak --tail=60 2>&1 | tee -a /tmp/devstack-boot.log
            echo "── ps -a ──" | tee -a /tmp/devstack-boot.log
            docker compose --env-file .env -f deploy/docker-compose.yml --profile app ps -a 2>&1 | tee -a /tmp/devstack-boot.log
          fi
          exit $rc
      - name: Wait for Spring readiness (max 9 min — liveness alone races Flyway)
        run: |
          for i in $(seq 1 54); do
            # readiness is DOWN until the datasource is wired; liveness goes UP long before
            # Flyway has created the schema, so the chat smoke used to 500 on
            # relation "albaraka_ai.conversation" does not exist
            if curl -sf http://localhost:9002/actuator/health/readiness 2>/dev/null | grep -q '"status":"UP"'; then
              echo "server READY after $((i*10))s"; break
            fi
            sleep 10
            if [ "$i" = "54" ]; then echo "server did not become ready — dumping logs"; exit 1; fi
          done
          # schema provenance: did Flyway run, and does the conversation table exist? This
          # output is appended to the ci-logs channel so a missing table is diagnosable
          # without artifact access (the 'relation does not exist' 500 class).
          {
            echo "## flyway history (server schema)"
            docker compose --env-file .env -f deploy/docker-compose.yml --profile app exec -T postgres \
              psql -U albaraka -d albaraka_ai -c "SELECT installed_rank, version, description, success FROM flyway_schema_history ORDER BY installed_rank;" 2>&1 || echo "NO flyway_schema_history"
            echo "## tables in albaraka_ai"
            docker compose --env-file .env -f deploy/docker-compose.yml --profile app exec -T postgres \
              psql -U albaraka -d albaraka_ai -Atc "SELECT tablename FROM pg_tables WHERE schemaname='albaraka_ai' ORDER BY tablename;" 2>&1 | head -30
          } | tee -a /tmp/devstack-logs.txt /tmp/devstack-boot.log
      - name: Verify migrated schema + seeds (G1-G7 — the DDL really ran)
        run: |
          # Regression guard for the Boot-4 modularization bug: flyway-core was present but never
          # wired (no starter), so Flyway silently applied zero migrations. These gates only pass
          # if migrations really ran. schema_test.sql creates its own fixtures, so it must run
          # against a THROWAWAY database (its fixtures collide with the V900-V903 seeds on the
          # live DB); seed_test.sql asserts pure content and runs against the migrated DB.
          docker compose --env-file .env -f deploy/docker-compose.yml --profile app exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U albaraka -d postgres \
              -c 'DROP DATABASE IF EXISTS verify' -c 'CREATE DATABASE verify OWNER albaraka'
          err=0
          echo "── G1-G4 schema behavioural tests (reference DDL, throwaway db) ──"
          cat specs/db/schema.sql | docker compose --env-file .env -f deploy/docker-compose.yml --profile app exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U albaraka -d verify -f - 2>&1 | tail -3 || err=1
          cat specs/db/tests/schema_test.sql | docker compose --env-file .env -f deploy/docker-compose.yml --profile app exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U albaraka -d verify -f - 2>&1 | tail -30 || err=1
          echo "── G5-G7 seed content tests (live Flyway database) ──"
          cat specs/db/tests/seed_test.sql | docker compose --env-file .env -f deploy/docker-compose.yml --profile app exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U albaraka -d albaraka_ai -f - 2>&1 | tail -45 || err=1
          docker compose --env-file .env -f deploy/docker-compose.yml --profile app exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U albaraka -d postgres -c 'DROP DATABASE IF EXISTS verify' >/dev/null 2>&1 || true
          if [ "$err" != "0" ]; then echo "schema/seed gates FAILED"; exit 1; fi
      - name: Wait for RAG health (max 3 min)
        run: |
          for i in $(seq 1 18); do
            if curl -sf http://localhost:9003/v1/rag/health >/dev/null; then
              echo "rag UP after $((i*10))s"; exit 0
            fi
            sleep 10
          done
          echo "rag did not become healthy"; exit 1
      - name: Smoke — one chat SSE round-trip via the edge
        run: |
          : > /tmp/devstack-smoke.txt
          ok=0
          token=$(grep -E '^RAG_SERVICE_TOKEN=' .env | cut -d= -f2-)
          for i in $(seq 1 12); do
            out=$(curl -sfN -m 60 -X POST http://localhost:9000/api/v1/chat \
              -H 'Content-Type: application/json' \
              -d '{"text":"comment ouvrir un compte courant ?","locale":"fr-FR"}' || true)
            # Spring's SSE encoder writes 'event:answer' without a space (valid per the SSE spec),
            # so match the name loosely instead of the exact 'event: answer' spelling.
            if echo "$out" | grep -qE '^event:[[:space:]]*answer'; then ok=1; echo "$out" | head -c 1200; break; fi
            {
              echo "== attempt $i/12 — no answer; received $(printf '%s' "$out" | wc -c) bytes via edge:"
              echo "-- edge frame sequence:"
              printf '%s\n' "$out" | grep -oE '^event:[^[:space:]]*' | uniq -c
              if [ "$i" = "1" ]; then
                echo "-- FULL edge stream (attempt 1) below:"
                printf '%s' "$out"
                echo
              else
                echo "-- edge stream head:"
                printf '%s' "$out" | head -c 300
                echo
              fi
              echo "-- direct RAG probe (authorized, what the server receives):"
              probe=$(curl -sN -m 30 -X POST http://localhost:9003/v1/rag/chat \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer $token" \
                -d '{"text":"comment ouvrir un compte courant ?","context":{"conversation_id":"11111111-1111-4111-8111-111111111111","message_id":"22222222-2222-4222-8222-222222222222","locale":"fr-FR","channel":"WEB_APP","audience":"PUBLIC","max_classification":"PUBLIC","retrieval_config":{}}}' || true)
              if [ -z "$probe" ]; then
                echo "(direct RAG probe failed — HTTP non-success)"
              else
                printf '%s\n' "$probe" | grep -oE '^event:[^[:space:]]*' | uniq -c
                printf '%s' "$probe" | head -c 300
                echo
              fi
              echo
            } | tee -a /tmp/devstack-smoke.txt
            sleep 5
          done
          [ "$ok" = "1" ] || { echo "chat SSE smoke failed — no answer event" | tee -a /tmp/devstack-smoke.txt; exit 1; }
      - name: Smoke — SPA shells via the edge (frontoffice, admin, module MIME)
        run: |
          {
            set -euo pipefail
            # The edge/web containers only start after server AND keycloak are healthy
            # (depends_on conditions), so the checks below must not race the boot — poll
            # the frontoffice index first.
            for i in $(seq 1 18); do
              if curl -sf --max-time 5 http://localhost:9000/ 2>/dev/null | grep -q "Al-Mouchir"; then
                echo "frontoffice index ready after $((i*5))s"
                break
              fi
              [ "$i" = "18" ] && { echo "frontoffice index missing"; exit 1; }
              sleep 5
            done
            # frontoffice: index + the module bundle must be a real JS file, not HTML (a
            # non-JS MIME makes the browser refuse the module → blank page with 200s)
            body=$(curl -sf http://localhost:9000/)
            echo "$body" | grep -q "Al-Mouchir" || { echo "frontoffice index missing"; exit 1; }
            js=$(echo "$body" | grep -oE 'main-[A-Za-z0-9_-]+\.js' | head -1)
            [ -n "$js" ] || { echo "no main bundle in frontoffice index"; exit 1; }
            ctype=$(curl -sfI "http://localhost:9000/$js" | grep -i '^content-type:' | tr -d '\r')
            echo "$ctype" | grep -qi "javascript" || { echo "bad module MIME: $ctype"; exit 1; }
            echo "frontoffice OK ($js → $ctype)"
            # admin: /admin must 301→/admin/ and follow to the real admin index (no 302 loop)
            loc=$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:9000/admin)
            [ "$loc" = "http://localhost:9000/admin/" ] || { echo "bad /admin redirect: $loc"; exit 1; }
            admin=$(curl -sfL http://localhost:9000/admin/)
            echo "$admin" | grep -q "Al-Mouchir Admin" || { echo "admin index missing"; exit 1; }
            ajs=$(echo "$admin" | grep -oE 'main-[A-Za-z0-9_-]+\.js' | head -1)
            [ -n "$ajs" ] || { echo "no main bundle in admin index"; exit 1; }
            ctype2=$(curl -sfI "http://localhost:9000/admin/$ajs" | grep -i '^content-type:' | tr -d '\r')
            echo "$ctype2" | grep -qi "javascript" || { echo "bad admin module MIME: $ctype2"; exit 1; }
            echo "admin OK ($ajs → $ctype2)"
          } > /tmp/devstack-spa.txt 2>&1
          rc=$?
          cat /tmp/devstack-spa.txt
          if [ "$rc" -ne 0 ]; then
            echo "── SPA smoke output (failure) ──" >> /tmp/devstack-smoke.txt
            cat /tmp/devstack-spa.txt >> /tmp/devstack-smoke.txt
          fi
          exit $rc
      - name: Show containers
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml --profile app ps
      - name: Dump service logs (always — for the iteration loop)
        if: always()
        run: |
          docker compose --env-file .env -f deploy/docker-compose.yml --profile app logs --tail=400 > /tmp/devstack-logs.txt 2>&1 || true
          cat /tmp/devstack-logs.txt
          mkdir -p ci-logs
          {
            echo "## run $GITHUB_RUN_ID — keycloak"
            docker compose --env-file .env -f deploy/docker-compose.yml --profile app logs keycloak --tail=250 2>&1 | head -250 || true
            echo
            echo "## server (Flyway, boot, chat errors)"
            docker compose --env-file .env -f deploy/docker-compose.yml --profile app logs server --tail=250 2>&1 | head -250 || true
            echo
            echo "## server — flyway / migration lines (whole log)"
            docker compose --env-file .env -f deploy/docker-compose.yml --profile app logs server 2>&1 | grep -iE "flyway|migrat|schema|validat|noop|locations" | head -120 || true
            echo
            echo "## server — chat/rag frame lines (whole log)"
            docker compose --env-file .env -f deploy/docker-compose.yml --profile app logs server 2>&1 | grep -iE "chat frame|rag frame|rag stream|persistence" | head -200 || true
            echo
            echo "## rag-assistant"
            docker compose --env-file .env -f deploy/docker-compose.yml --profile app logs rag-assistant --tail=250 2>&1 | head -250 || true
            echo
            echo "## chat smoke diagnostics"
            cat /tmp/devstack-smoke.txt 2>/dev/null || echo "(no smoke output)"
            echo
            echo "## ps -a"
            docker compose --env-file .env -f deploy/docker-compose.yml --profile app ps -a 2>&1 || true
            echo
            echo "## postgres"
            docker compose --env-file .env -f deploy/docker-compose.yml --profile app logs postgres --tail=80 2>&1 | head -80 || true
          } > ci-logs/latest.txt
          cat ci-logs/latest.txt
      - name: Emit devstack logs as annotations (API-readable)
        if: failure()
        run: |
          for f in /tmp/devstack-build.log /tmp/devstack-boot.log /tmp/devstack-logs.txt; do
            [ -f "$f" ] && grep -inE "error|exception|failed|cannot find|fatal|exit code|unknown" "$f" | tail -n 25 | sed 's/^/::error file=devstack.log::/'
          done
      - name: Commit boot diagnostics for the iteration loop
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@albaraka-ai.local"
          git add ci-logs/latest.txt
          git commit -q -m "ci: capture keycloak boot log (run $GITHUB_RUN_ID)" || true
          git push origin HEAD:arena/01a06861-albaraka-ai 2>&1 | tail -2
      - name: Upload devstack logs (always)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: devstack-logs
          path: /tmp/devstack-*
