[project]
name = "rag-assistant"
version = "0.1.0"
description = "Al-Mouchir RAG assistant — LangChain retrieval/generation service (ADR-009)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "numpy>=1.26",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-postgres>=0.0.17",
  "langchain-groq>=0.3",
  "langchain-google-genai>=2.0,<2.5",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "redis>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
