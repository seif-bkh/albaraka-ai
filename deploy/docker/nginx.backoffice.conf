# backoffice-web container edge — the SPA is built with --base-href /admin/
# and reaches the host through deploy/nginx/nginx.conf location ^~ /admin/.
server {
    listen 80;
    server_name _;

    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /admin/index.html;
    }
    location = / { return 302 /admin/; }
}
