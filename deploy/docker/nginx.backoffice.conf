# backoffice-web container — static host for the Angular admin bundle (base href "/admin/").
#
# The EDGE (deploy/nginx/nginx.conf) owns the /admin prefix: `location /admin/ { proxy_pass
# http://backoffice-web:80/; }` strips it, so this container ALWAYS sees root-relative URLs
# (/, /main-*.js, /styles-*.css, /favicon.ico). That is why there is NO alias, NO redirect and
# NO $request_uri here — the previous alias+try_files+return chain produced a 302 on /admin
# that browsers would not follow, and alias semantics made the SPA assets unreachable.
server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # explicit MIME safety for modern module scripts (blank-page guard, see frontoffice conf)
    location ~* \.(js|mjs)$ {
        types { application/javascript js mjs; }
        try_files $uri =404;
    }
}
