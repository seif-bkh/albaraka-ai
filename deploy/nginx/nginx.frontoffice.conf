# frontoffice-web container — static host for the Angular bundle (base href "/").
# Requests reach this container already rewritten by the edge (deploy/nginx/nginx.conf).
server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # explicit MIME safety for modern module scripts — a module script served with a
    # non-JS content type is refused by the browser → blank page with 200 responses
    location ~* \.(js|mjs)$ {
        types { application/javascript js mjs; }
        try_files $uri =404;
    }
}
