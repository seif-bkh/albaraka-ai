# Edge config — local compose (docs/12 §2.1): one origin, three upstreams.
#
# /admin belongs to the backoffice-web container, which is built with --base-href /admin/.
# The prefix is stripped HERE (proxy_pass with a trailing slash), so the backoffice container
# serves root-relative URLs from its own static root. Note the previous variant proxied with
# $request_uri into an alias location and returned a 302 on /admin that browsers did not
# follow — admin "could not be loaded" while every container looked healthy.
server {
    listen 80;
    server_name _;

    # a plain 301 (no body) is the only redirect in the chain: /admin → /admin/
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        proxy_pass http://backoffice-web:80/;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location / {
        proxy_pass http://frontoffice-web:80;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # API → Spring (SSE must not be buffered)
    location /api/ {
        proxy_pass http://server:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Actuator (health probes from the host)
    location /actuator/ {
        proxy_pass http://server:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
