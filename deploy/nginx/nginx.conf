# Edge config — local compose (docs/12 §2.1): one origin, three upstreams.
server {
    listen 80;
    server_name _;

    # SPA + admin routes
    location = /admin {
        proxy_pass http://backoffice-web:80/;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location ~ ^/admin(/|$) {
        proxy_pass http://backoffice-web:80$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location / {
        proxy_pass http://frontoffice-web:80;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # API → Spring (SSE must not be buffered)
    location /api/ {
        proxy_pass http://server:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Actuator (health probes from the host)
    location /actuator/ {
        proxy_pass http://server:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
