spring:
  application:
    name: albaraka-assistant
  main:
    banner-mode: off
    web-application-type: reactive
  config:
    # The platform contract lives in the repository (specs/config) and is mounted read-only by
    # compose (docs/10 §4). Import the whole directory so the dev profile's application-dev.yaml
    # is also resolved, with the local defaults as a safety net.
    import: optional:file:/app/specs/config/,optional:classpath:application-local.yml
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  server:
    port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    tn.albaraka.ai: DEBUG

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
